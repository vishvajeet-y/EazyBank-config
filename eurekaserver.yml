#we don't have multiple property file{qa,prod,dev} because my Eurekaserver is going to work in very similar way for all kind of profile..
#This is becuase Eurekaserver does not have dependency on DB credentials or any other buisness logic which will behave in diffrent ways..

server:
  port: 8070
eureka:
  instance:
    hostname: localhost

  client:
  #By default it is true and we don't want our Eurekaserver to fetch registry details of other MS.My Eurekaserver never going to call MS that's
  #why it is unnecessary to fetch all registry details of MS
    fetchRegistry: false 
    #As we don't want Eurekaserver to register with itself,we mention this property as false
    registerWithEureka: false
    serviceUrl:
      defaultZone: http://${eurka.instance.hostname}:${server.port}/eureka/
